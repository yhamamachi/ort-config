---
# This file contains global resolutions for issues and rule violations occurring in the OSS scan.
# These resolutions are applied to all scanned projects, so make sure to only
# add resolutions that are not specific to a project. Project specific
# resolutions can be configured in the .ort.yml file of the project.
#
# For detailed documentation on this file, see
# https://github.com/oss-review-toolkit/ort/blob/main/docs/config-file-resolutions-yml.md.

issues:
  - message: ".*DownloadException: Download failed for 'Maven:android..*"
    reason: "CANT_FIX_ISSUE"
    comment: "Android SDK Maven artifacts commonly neither declare an SCM tag nor have sources artifacts published."
  - message: ".*DownloadException: No source artifact URL provided for 'Maven:com.android..*"
    reason: "CANT_FIX_ISSUE"
    comment: "Android SDK Maven artifacts commonly neither declare an SCM tag nor have sources artifacts published."

rule_violations:
  - message: ".*LicenseRef-Firmware-r8a779g-pcie-phy.*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "Firmware of Synopsys and Renesas published in linux-firmware (LICENCE.r8a779g_pcie_phy). Redistribution in binary form without modification is permitted if the copyright notice and the disclaimer are reproduced, and reverse engineering is not permitted. The license text is included in the NOTICE file."
  - message: ".*LicenseRef-Renesas-GFX.*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "Renesas GFX user module (rcar-gfx-License.txt). Redistribution and use in binary form without modification are permitted only with Renesas Electronics devices, and reverse engineering is not permitted. Sparrow Hawk uses R-Car V4H, which is a Renesas device. The license text is included in the NOTICE file."
  - message: ".*(gles-user-module|kernel-module-gles).*LicenseRef-scancode-proprietary-license.*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "Files of the Renesas GFX package (rc.pvr, powervr.ini, 72-pvr-seat.rules, MIT-COPYING etc.) are covered by rcar-gfx-License.txt. Some of these file headers say 'License Strictly Confidential', which conflicts with the package license. The header text should be corrected by the owner of the GFX package. MIT-COPYING is a dual MIT/GPL text whose 'negotiated agreement' sentence is detected as proprietary."
  - message: ".*(gles-user-module|kernel-module-gles).*LicenseRef-scancode-commercial-license.*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "Detected in headers of the GFX kernel module (physheap.h, tlstream.h) that say 'License Dual MIT/GPLv2'. The 'negotiated agreement' sentence of the MIT text is detected as commercial."
  - message: ".*LicenseRef-scancode-google-patent-license-webm.*"
    reason: "PATENT_GRANT_EXCEPTION"
    comment: "Google WebM patent license: a royalty-free patent grant for libwebp / libvpx related code."
  - message: ".*LicenseRef-scancode-google-patent-license-golang.*"
    reason: "PATENT_GRANT_EXCEPTION"
    comment: "Google Go patent grant (PATENTS file): a royalty-free patent grant. Detected in the Go front end of gcc (libgo, not built in the image; excluded by path) and in one file of gst-libs of gst-plugins-bad."
  - message: ".*LicenseRef-scancode-on2-patent.*"
    reason: "PATENT_GRANT_EXCEPTION"
    comment: "libtheora: On2 grants a non-assertion covenant for the VP3 codec patents to every user of the software."
  - message: ".*LicenseRef-scancode-freetype-patent.*"
    reason: "PATENT_GRANT_EXCEPTION"
    comment: "FreeType psaux (Adobe code): each contributor grants a royalty-free, irrevocable patent license under the FreeType Project License."
  - message: ".*LicenseRef-scancode-ocb-open-source-2013.*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "libgcrypt cipher-ocb.c: OCB License 1 (2013-01-09) allows use in open-source software implementations. libgcrypt is distributed as open source (LGPL/GPL), so the license applies."
  - message: ".*(Unicode-TOU).*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "libidn2: Unicode Terms of Use for the bundled Unicode data allow free use and redistribution if the copyright notice and permission notice are kept (COPYING.unicode is distributed)."
  - message: ".*SISSL.*"
    reason: "CANT_FIX_EXCEPTION"
    comment: "perl cpan/CPAN-Meta: SISSL is only listed as a valid license name in the CPAN::Meta spec text. It is not the license of the code."
  - message: ".*'[^']*:(dnf|libdnf|python3-dnf|libsolv|librepo|libmodulemd)[^:']*:[^']*'.*LicenseRef-scancode-proprietary-license.*"
    reason: "CANT_FIX_EXCEPTION"
    comment: "The headers say GPLv2-or-later and add a Red Hat trademark notice ('Any Red Hat trademarks ... are not subject to the GNU General Public License'). The trademark sentence is detected as proprietary. The code is GPL; the trademark notice only concerns the Red Hat trademarks."
  - message: ".*LicenseRef-scancode-proprietary-license.*"
    reason: "CANT_FIX_EXCEPTION"
    comment: "Verified false positives by reading the matched lines (2026-11): the words 'proprietary', 'commercial' or 'non-commercial' in comments or documentation (taglib.h 'allow usage within proprietary applications', stb_truetype.h 'non-commercial fonts', Vulkan headers, mesa zink/radv, SDL_qsort.c public-domain notice, perl File::Copy and Unicode NamesList, openssl funding.json, libgcrypt jitterentropy-gcd.c BSD notice, alsa-tools 'license' field name, ffmpeg opt_common.c warning that is printed only when built with --enable-nonfree). ffmpeg is built without --enable-nonfree: fdk-aac is not in the image and USE_NONFREE is not set. The detection is a trigger, not a license. Review again if a new package is added."
  - message: ".*LicenseRef-scancode-commercial-license.*"
    reason: "CANT_FIX_EXCEPTION"
    comment: "Dual-licensed files where a GPL option is available (u-boot bios_emulator: GPL-2.0-only OR commercial; pinentry tqt: Qt-derived GPL/commercial, pinentry-tqt is not in the image). GFX files are covered by the separate GFX resolution."
  - message: ".*gstreamer1.0-plugins-bad-decklink.*"
    reason: "LICENSE_ACQUIRED_EXCEPTION"
    comment: "DeckLink API headers bundled in gst-plugins-bad (sys/decklink) carry the Blackmagic Design license: use, reproduction and distribution are allowed, the copyright notice and the license text must be kept in copies of the source, and the notice is not required for machine-executable object code. The image distributes object code only; the source archive keeps the headers with their notice."
  - message: ".*CC-BY-NC-ND-3.0.*"
    reason: "CANT_FIX_EXCEPTION"
    comment: "SDL2 src/hidapi/Makefile.am lists the file names LICENSE-bsd.txt, LICENSE-gpl3.txt and LICENSE-orig.txt in dist_doc_DATA; hidapi is BSD or GPL-3 or the original hidapi license. It is a detection on a build file."
  - message: ".*UNHANDLED_LICENSE.*NOASSERTION.*|.*The license NOASSERTION.*"
    reason: "CANT_FIX_EXCEPTION"
    comment: "NOASSERTION is a ScanCode detection of a reference to a license file elsewhere ('See COPYING', 'See Copyright for the status of this software', 'For licencing details, see COPYING'), not a license text. 2,604 of 3,382 affected files also have a real license detected. For the other 778 files the references were checked on samples of the largest sources (libxml2, hwloc, mruby in nghttp2, libsndfile GSM610, libgcrypt jitterentropy, numpy, linux). The remaining small sources (37) were not read one by one."
